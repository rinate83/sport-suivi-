<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ApexFit">
<title>ApexFit — Suivi sportif, programmes et test de capacités</title>
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#070b14;--bg2:#0c1220;--card:#111827;--card2:#162033;--line:#1f2a3d;--line2:#2b3850;--tx:#eef2f9;--mu:#93a0b8;--dim:#64708a;
--ac:#22c55e;--ac2:#4ade80;--in:#818cf8;--warn:#f59e0b;--dan:#f43f5e;--r:20px;--nav:74px;
--grad:linear-gradient(135deg,#22c55e,#14b8a6)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;background:var(--bg);color:var(--tx)}
body{margin:0;min-height:100vh;padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 14px);
background:radial-gradient(900px 420px at 100% -10%,rgba(34,197,94,.13),transparent 60%),radial-gradient(800px 380px at -10% 0,rgba(129,140,248,.12),transparent 60%),var(--bg);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:22px;height:22px;flex:none}
.hidden{display:none!important}
/* en-tête */
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:rgba(7,11,20,.78);backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px);border-bottom:1px solid rgba(31,42,61,.6)}
.top img{width:38px;height:38px;border-radius:11px}
.top b{font-size:18px;letter-spacing:-.02em}.top b span{color:var(--ac)}
.top small{display:block;color:var(--mu);font-size:12px}
.top .back{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer}
.streak{margin-left:auto;display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:13px}
main{max-width:980px;margin:0 auto;padding:16px}
h1.vt{font-size:26px;letter-spacing:-.03em;margin:4px 2px 14px}
h2{font-size:17px;margin:0;letter-spacing:-.01em}
h3.sec{font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);margin:22px 4px 10px;display:flex;align-items:center;justify-content:space-between}
h3.sec a{color:var(--ac);text-transform:none;letter-spacing:0;font-size:13.5px;font-weight:650;cursor:pointer}
.card{background:linear-gradient(180deg,var(--card),#0f1624);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:0 10px 30px -18px rgba(0,0,0,.7)}
.card+.card{margin-top:12px}
.row{display:flex;align-items:center;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(min-width:760px){.cols{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;align-items:start}}
.mu{color:var(--mu)}.small{font-size:13px}.tiny{font-size:11.5px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:99px;font-size:12px;font-weight:650;background:var(--card2);border:1px solid var(--line);color:var(--mu)}
.pill.ok{color:#86efac;border-color:rgba(34,197,94,.35);background:rgba(34,197,94,.1)}
.pill.warn{color:#fcd34d;border-color:rgba(245,158,11,.35);background:rgba(245,158,11,.1)}
.pill.dan{color:#fda4af;border-color:rgba(244,63,94,.35);background:rgba(244,63,94,.1)}
/* tuiles stats */
.kpi{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:12px}
.kpi .l{font-size:11.5px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:4px}.kpi .v small{font-size:13px;color:var(--mu);font-weight:600}
/* héro récap */
.hero{position:relative;overflow:hidden;background:linear-gradient(140deg,#0f2a1d,#0d1b2e 60%,#18153a);border:1px solid rgba(34,197,94,.25)}
.hero:after{content:'';position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(34,197,94,.35),transparent 70%)}
.ring{--p:0;width:96px;height:96px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--ac) calc(var(--p)*1%),rgba(255,255,255,.08) 0);position:relative}
.ring:before{content:'';position:absolute;inset:9px;border-radius:50%;background:#0d1a26}
.ring b{position:relative;font-size:22px}.ring small{position:relative;display:block;font-size:11px;color:var(--mu);text-align:center;margin-top:-4px}
/* calendrier */
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-h button{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:var(--card2);cursor:pointer;display:grid;place-items:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .dn{font-size:11px;color:var(--dim);text-align:center;font-weight:700;padding:4px 0}
.cal .d{aspect-ratio:1/1.05;border-radius:12px;background:rgba(255,255,255,.025);border:1px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:5px 2px;font-size:13px;font-weight:650;cursor:pointer;position:relative}
.cal .d.out{opacity:.25}.cal .d.today{border-color:var(--ac);color:var(--ac2)}
.cal .d.act{background:linear-gradient(180deg,rgba(34,197,94,.16),rgba(34,197,94,.04))}
.cal .d.plan:after{content:'';position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;border:1.5px solid var(--warn)}
.dots{display:flex;gap:2px;justify-content:center;flex-wrap:wrap;min-height:7px}.dots i{width:6px;height:6px;border-radius:50%}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.legend span{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--mu)}.legend i{width:8px;height:8px;border-radius:50%}
/* listes */
.li{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--card2);border:1px solid var(--line);cursor:pointer;width:100%;text-align:left}
.li+.li{margin-top:8px}
.li .em{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:21px;flex:none;background:rgba(255,255,255,.05)}
.li .t{flex:1;min-width:0}.li .t b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.li .t small{display:block;color:var(--mu);font-size:12.5px;margin-top:2px}
.li .chev{color:var(--dim)}
.sports{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.sports{grid-template-columns:repeat(4,1fr)}}
.sp{position:relative;overflow:hidden;border-radius:18px;padding:14px;border:1px solid var(--line);background:var(--card);cursor:pointer;text-align:left;min-height:118px;display:flex;flex-direction:column;justify-content:space-between}
.sp:before{content:'';position:absolute;inset:0;background:radial-gradient(160px 120px at 100% 0,var(--c),transparent 70%);opacity:.28}
.sp .e{font-size:30px;position:relative}.sp b{position:relative;font-size:15px}.sp small{position:relative;color:var(--mu);font-size:12px}
.sp.off{opacity:.45}
/* onglets segment */
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--card2);border:1px solid var(--line);margin:14px 0}
.seg button{flex:1;padding:10px 6px;border-radius:11px;border:0;background:transparent;color:var(--mu);font-weight:650;font-size:13.5px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 2px 10px rgba(0,0,0,.4)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 13px;border-radius:99px;border:1px solid var(--line);background:var(--card2);color:var(--mu);font-size:13px;font-weight:650;cursor:pointer}
.chip.on{background:rgba(34,197,94,.14);border-color:rgba(34,197,94,.5);color:#86efac}
/* boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 16px;border-radius:15px;border:1px solid var(--line2);background:var(--card2);font-weight:700;font-size:15px;cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.45}
.btn.pri{background:var(--grad);border-color:transparent;color:#04220f;box-shadow:0 10px 24px -12px rgba(34,197,94,.9)}
.btn.dan{color:#fda4af;border-color:rgba(244,63,94,.35);background:rgba(244,63,94,.08)}
.btn.w{width:100%}.btn.sm{padding:9px 12px;font-size:13.5px;border-radius:12px}
.btn.ghost{background:transparent}
/* formulaires */
label.f{display:block;font-size:12.5px;color:var(--mu);font-weight:650;margin-top:12px}
.in,select.in,textarea.in{width:100%;margin-top:6px;padding:12px 13px;border-radius:13px;border:1px solid var(--line2);background:#0a1120;color:var(--tx);font-size:16px;-webkit-appearance:none;appearance:none}
.in:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px rgba(34,197,94,.18)}
textarea.in{min-height:70px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--ac)}
/* barre d'onglets */
.nav{position:fixed;z-index:50;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));height:66px;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:6px;border-radius:24px;background:rgba(17,24,39,.86);backdrop-filter:saturate(1.6) blur(20px);-webkit-backdrop-filter:saturate(1.6) blur(20px);border:1px solid var(--line2);box-shadow:0 16px 40px -12px rgba(0,0,0,.8);max-width:560px;margin:0 auto}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:var(--dim);font-size:11px;font-weight:700;cursor:pointer;padding:6px 0;border-radius:16px}
.nav button.on{color:var(--ac2)}
.nav .plus{width:54px;height:54px;margin:auto;border-radius:18px;background:var(--grad);color:#04220f;box-shadow:0 10px 24px -8px rgba(34,197,94,.9);justify-content:center}
.nav .plus svg{width:28px;height:28px}
/* feuilles (modales) */
.sheet-bg{position:fixed;inset:0;z-index:80;background:rgba(2,6,14,.6);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;animation:fd .2s}
.sheet{width:100%;max-width:620px;max-height:92vh;overflow:auto;background:#0e1524;border:1px solid var(--line2);border-radius:26px 26px 0 0;padding:8px 18px calc(18px + env(safe-area-inset-bottom));animation:up .25s cubic-bezier(.2,.8,.2,1)}
@media(min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:26px}}
.sheet .grab{width:42px;height:5px;border-radius:5px;background:var(--line2);margin:4px auto 12px}
.sheet h2{font-size:21px;margin-bottom:4px}
@keyframes up{from{transform:translateY(40px);opacity:0}}@keyframes fd{from{opacity:0}}
/* séance en direct */
.live{position:fixed;inset:0;z-index:70;background:var(--bg);overflow:auto;padding-bottom:140px}
.live .lh{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:rgba(7,11,20,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.live .clock{font-variant-numeric:tabular-nums;font-weight:800;font-size:18px;color:var(--ac2)}
.ex{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:12px 16px 0}
.ex .eh{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.ex .eh b{font-size:16px;flex:1}
.ex .last{font-size:12px;color:var(--mu);margin:-4px 0 8px}
.set{display:grid;grid-template-columns:32px 1fr 1fr 48px;gap:8px;align-items:center;margin-top:7px}
.set.t3{grid-template-columns:32px 1fr 48px}
.set .n{font-weight:800;color:var(--dim);text-align:center}
.set input{width:100%;padding:11px 8px;border-radius:12px;border:1px solid var(--line2);background:#0a1120;text-align:center;font-size:16px;font-weight:700}
.set .ok{height:44px;border-radius:13px;border:1px solid var(--line2);background:var(--card2);cursor:pointer;display:grid;place-items:center;color:var(--dim)}
.set.done .ok{background:var(--ac);color:#04220f;border-color:transparent}
.set.done input{border-color:rgba(34,197,94,.4);color:#86efac}
.set .lab{font-size:11px;color:var(--dim);text-align:center}
.restbar{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:75;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:20px;background:#0f2a1d;border:1px solid rgba(34,197,94,.5);box-shadow:0 18px 40px -10px rgba(0,0,0,.8)}
.restbar .big{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ac2);min-width:76px}
.restbar .prog{position:absolute;left:0;bottom:0;height:3px;background:var(--ac);border-radius:3px}
.block{display:flex;gap:12px;align-items:flex-start;padding:13px;border-radius:16px;background:var(--card2);border:1px solid var(--line);margin-top:8px;cursor:pointer}
.block .ck{width:26px;height:26px;border-radius:9px;border:2px solid var(--line2);flex:none;display:grid;place-items:center}
.block.done .ck{background:var(--ac);border-color:var(--ac);color:#04220f}
.block.done b{text-decoration:line-through;color:var(--mu)}
.bigclock{font-size:56px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.03em;margin:8px 0}
/* bibliothèque */
.mv{display:flex;gap:12px;align-items:center}
.lvl{display:inline-flex;gap:2px}.lvl i{width:6px;height:12px;border-radius:2px;background:var(--line2)}.lvl i.on{background:var(--ac)}
ol.how{padding-left:20px;margin:8px 0}ol.how li{margin:6px 0;line-height:1.45}
ul.err{padding-left:18px;margin:6px 0;color:#fda4af}ul.err li{margin:4px 0}
.tip{padding:12px 14px;border-radius:14px;background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.25);color:#bbf7d0;font-size:14px;margin-top:10px}
/* barres */
.pbar{height:8px;border-radius:8px;background:rgba(255,255,255,.07);overflow:hidden}.pbar i{display:block;height:100%;background:var(--grad);border-radius:inherit}
canvas.ch{width:100%;display:block}
/* notifications */
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 22px);transform:translateX(-50%);z-index:200;background:#1f2937;border:1px solid var(--line2);color:#fff;padding:12px 16px;border-radius:14px;font-weight:650;font-size:14px;box-shadow:0 16px 30px -10px rgba(0,0,0,.8);max-width:92%;animation:up .25s}
.empty{text-align:center;padding:26px 12px;color:var(--mu)}.empty .e{font-size:38px}
.test-step{font-size:12px;color:var(--ac2);font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.choice{display:grid;gap:8px;margin-top:10px}.choice button{text-align:left}
.choice button.on{border-color:var(--ac);background:rgba(34,197,94,.12)}
.score{display:flex;align-items:center;gap:10px;margin-top:8px}.score span{flex:1;font-size:14px}.score .pbar{flex:1.3}

/* images des mouvements */
.mvimg{position:relative;display:block;overflow:hidden;background:#e2e8f0;flex:none}
.mvimg img{display:block;width:100%;height:100%;object-fit:cover}
.mvimg.anim img:nth-child(2){position:absolute;inset:0;animation:frame 2.4s steps(1) infinite}
@keyframes frame{0%{opacity:0}50%{opacity:1}}
.mvimg.thumb{width:56px;height:56px;border-radius:14px}
.mvimg.big{width:100%;aspect-ratio:4/3;border-radius:18px;margin:4px 0 10px}
.mvimg.big img{object-fit:contain;background:#f1f5f9}
.ex .eh .mvimg.thumb{width:48px;height:48px;border-radius:12px}

/* ===== interactions dynamiques ===== */
.rise{animation:rise .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 45ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.btn,.li,.sp,.chip,.nav button,.cal .d,.block{transition:transform .12s ease,background .2s,border-color .2s}
.li:active,.sp:active,.cal .d:active,.block:active{transform:scale(.97)}
.chip:active,.nav button:active{transform:scale(.92)}
.nav .plus{transition:transform .2s cubic-bezier(.3,1.6,.5,1)}.nav .plus:active{transform:scale(.88) rotate(90deg)}
.nav button.on svg{animation:navpop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes navpop{40%{transform:translateY(-4px) scale(1.15)}}
.streak.hot svg{color:#fb923c;animation:flame 1.6s ease-in-out infinite;transform-origin:50% 90%}
@keyframes flame{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.15) rotate(3deg);filter:drop-shadow(0 0 6px rgba(251,146,60,.8))}}
.pbar i{transition:width .9s cubic-bezier(.2,.8,.2,1)}
.cal.slideL{animation:slL .3s ease}.cal.slideR{animation:slR .3s ease}
@keyframes slL{from{opacity:0;transform:translateX(30px)}}@keyframes slR{from{opacity:0;transform:translateX(-30px)}}
.cal .d.today{animation:today 2.4s ease-in-out infinite}
@keyframes today{50%{box-shadow:0 0 0 4px rgba(34,197,94,.18)}}
.set.pop .ok{animation:pop .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.ex{transition:border-color .4s,box-shadow .4s}
.ex.allDone{border-color:rgba(34,197,94,.55);box-shadow:0 0 0 1px rgba(34,197,94,.25),0 10px 30px -12px rgba(34,197,94,.5)}
.ex.allDone .eh b:after{content:'  ✓';color:var(--ac2)}
.restbar{animation:up .3s cubic-bezier(.2,.8,.2,1)}
.restbar.last{animation:beat .5s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.03);box-shadow:0 0 0 6px rgba(34,197,94,.25)}}
.block.done .ck{animation:pop .4s cubic-bezier(.3,1.8,.5,1)}
.sheet{will-change:transform}
.sheet .grab{width:48px;height:6px;cursor:grab}
.sp:hover .e,.sp:active .e{transform:scale(1.12) rotate(-6deg)}.sp .e{transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.kpi{transition:transform .2s}.kpi:active{transform:scale(.97)}
.choice button.on{animation:pop .35s cubic-bezier(.3,1.8,.5,1)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

</style>
</head>
<body>
<header class="top" id="top"></header>
<main id="view"></main>
<nav class="nav" id="nav"></nav>
<script>
// ===================== SPORTS =====================
const SPORTS = {
  course:   { nom: 'Course à pied', ic: '🏃', c: '#22c55e', kind: 'cardio', dist: 'km', deniv: true },
  muscu:    { nom: 'Musculation', ic: '🏋️', c: '#818cf8', kind: 'force' },
  velo:     { nom: 'Vélo', ic: '🚴', c: '#f59e0b', kind: 'cardio', dist: 'km', deniv: true },
  natation: { nom: 'Natation', ic: '🏊', c: '#38bdf8', kind: 'cardio', dist: 'm' },
  hiit:     { nom: 'HIIT / Cross-training', ic: '🔥', c: '#f43f5e', kind: 'force' },
  mobilite: { nom: 'Yoga / Mobilité', ic: '🧘', c: '#c084fc', kind: 'force' },
  marche:   { nom: 'Marche / Rando', ic: '🥾', c: '#a3e635', kind: 'cardio', dist: 'km', deniv: true },
  autre:    { nom: 'Autre sport', ic: '⚽', c: '#94a3b8', kind: 'libre' }
};

// ===================== BIBLIOTHÈQUE DE MOUVEMENTS =====================
// M(sport, id, nom, groupe, matériel, niveau 1-3, muscles, [étapes], [erreurs], conseil, dose conseillée)
const LIB = [];
const M = (s, id, n, g, mat, niv, mu, how, err, tip, dose) => LIB.push({ s, id, n, g, mat, niv, mu, how, err, tip, dose });

// ---- Musculation
M('muscu', 'dc', 'Développé couché', 'Pectoraux', 'Barre + banc', 2, 'Pectoraux, triceps, épaules avant',

const ICONS = {

  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', info: '<circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/>', edit: '<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>'

const ic = (n, cls = 'i') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]}</svg>`;
function toast(t, ms = 2600) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), ms); }

// ===================== DONNÉES =====================
const KEY = 'apexfit_v3';
let S = load();
function blank() { return { v: 3, profile: { prenom: '', age: 30, sexe: 'h', poids: '', taille: '', obj: 'forme', jours: 3, mat: ['aucun'], sports: [] }, sessions: [], templates: [], tests: [], prog: null, goals: [], skipTest: false }; }
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.v === 3) return Object.assign(blank(), s); } catch (e) {}
  const s = blank();
  try { // reprise des données de l'ancienne version (apexfit_state)
    const o = JSON.parse(localStorage.getItem('apexfit_state'));
    if (o && Array.isArray(o.workouts)) {
      const map = { 'Développé Couché': 'dc', 'Squat': 'squat', 'Tractions': 'tractions', 'Développé Militaire': 'dm', 'Soulevé de Terre': 'sdt', 'Curl Biceps': 'curl' };
      o.workouts.forEach(w => {
        if (w.type === 'running') s.sessions.push({ id: uid(), date: w.date, sport: 'course', nom: 'Course', dur: +w.duration || 0, dist: +w.distance || 0, deniv: +w.elevation || 0, rpe: 0 });
        else if (w.type === 'muscu') s.sessions.push({ id: uid(), date: w.date, sport: 'muscu', nom: w.exercise, dur: (w.sets || 3) * 3, rpe: 0, items: [{ mv: map[w.exercise] || w.exercise, n: w.exercise, sets: Array.from({ length: w.sets || 1 }, () => ({ reps: w.reps, kg: w.weight, done: true })) }] });
      });
      (o.goals || []).forEach(g => s.goals.push({ id: uid(), type: g.unit === 'km' ? 'km' : 'seances', sport: g.unit === 'km' ? 'course' : (g.id === 2 ? 'muscu' : 'all'), target: g.target, titre: g.title, penalite: g.penalty }));
      s.profile.sports = [...new Set(s.sessions.map(x => x.sport))];
    }
  } catch (e) {}
  if (!s.goals.length) s.goals = [{ id: uid(), type: 'seances', sport: 'all', target: 3, titre: '3 séances par semaine', penalite: '50 burpees' }];
  return s;
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('⚠️ Mémoire pleine : exportez vos données (Profil)'); } }
const sessionsOf = sp => S.sessions.filter(x => !sp || x.sport === sp);
const practiced = () => { const set = new Set([...(S.profile.sports || []), ...S.sessions.map(x => x.sport)]); return Object.keys(SPORTS).filter(k => set.has(k)); };
const distKm = x => !x.dist ? 0 : (SPORTS[x.sport] && SPORTS[x.sport].dist === 'm' ? x.dist / 1000 : x.dist);
const volKg = x => (x.items || []).reduce((a, it) => a + it.sets.filter(s => s.done).reduce((b, s) => b + (+s.reps || 0) * (+s.kg || 0), 0), 0);
const e1rm = (kg, r) => kg * (1 + r / 30);

// ===================== NAVIGATION =====================
let route = { v: 'home' }, calMonth = (() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); })();
function go(v, p = {}) { if (v === 'sport' && p.sp !== route.sp) { spTab = 'suivi'; libQ = ''; libG = 'Tous'; } route = Object.assign({ v }, p); render(); window.scrollTo(0, 0); }
function render() {
  const v = route.v;
  $$('.nav button[data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === v || (v === 'sport' && b.dataset.v === 'sports')));
  const back = v === 'sport';
  $('#top').innerHTML = `${back ? `<button class="back" onclick="go('sports')">${ic('left')}</button>` : '<img src="icons/icon.svg" alt="">'}
    <div><b>${back ? esc(SPORTS[route.sp].ic + ' ' + SPORTS[route.sp].nom) : 'APEX<span>FIT</span>'}</b><small>${back ? 'Suivi, mouvements, séances types' : greeting()}</small></div>
    <div class="streak ${streak() ? 'hot' : ''}">${ic('flame')}<span>${streak()} j</span></div>`;
  try { ({ home: vHome, sports: vSports, sport: vSport, programmes: vProgrammes, profil: vProfil })[v]();
  enhance();
  }
  catch (e) { console.error(e); $('#view').innerHTML = `<div class="card empty"><div class="e">⚠️</div>Un problème d’affichage est survenu.<br><small class="mu">${esc(e.message)}</small></div>`; }
}
function greeting() { const h = new Date().getHours(); return `${h < 18 ? 'Bonjour' : 'Bonsoir'}${S.profile.prenom ? ' ' + esc(S.profile.prenom) : ''} · ${fmtDate(today(), { weekday: 'long', day: 'numeric', month: 'long' })}`; }
// série réelle : jours consécutifs avec au moins une séance (aujourd'hui ou hier pour ne pas casser la série du jour)
function streak() {
  const days = new Set(S.sessions.map(x => x.date)); let d = new Date(); if (!days.has(ymd(d))) d.setDate(d.getDate() - 1);
  let n = 0; while (days.has(ymd(d))) { n++; d.setDate(d.getDate() - 1); } return n;
}
function weekStats(off = 0) {
  const a = monday(new Date()); a.setDate(a.getDate() + 7 * off); const b = new Date(a); b.setDate(b.getDate() + 7);
  const L = S.sessions.filter(x => { const d = parseD(x.date); return d >= a && d < b; });
  return { L, n: L.length, min: L.reduce((s, x) => s + (+x.dur || 0), 0), km: L.reduce((s, x) => s + distKm(x), 0), days: new Set(L.map(x => x.date)).size, a };
}

// ===================== ACCUEIL : RÉCAP + CALENDRIER =====================
function vHome() {
  const w = weekStats(), goal = +S.profile.jours || 3, p = clamp(Math.round(w.days / goal * 100), 0, 100), prev = weekStats(-1);
  const delta = w.min - prev.min, nx = nextProgSession(), lastTest = S.tests.at(-1);
  let h = `<div class="card hero"><div class="row" style="position:relative;gap:16px">
    <div class="ring" style="--p:${p}"><div><b>${w.days}/${goal}</b><small>jours</small></div></div>
    <div style="flex:1"><div class="mu small">Cette semaine</div><div style="font-size:22px;font-weight:800;margin:2px 0">${w.n} séance${w.n > 1 ? 's' : ''} · ${hmin(w.min)}</div>
    <div class="mu small">${w.km ? w.km.toFixed(1) + ' km parcourus · ' : ''}${prev.min || w.min ? (delta >= 0 ? '▲ ' : '▼ ') + hmin(Math.abs(delta)) + ' vs sem. dernière' : 'Commencez votre semaine !'}</div></div></div>
    <canvas class="ch" id="weekChart" height="120" style="margin-top:12px;position:relative"></canvas></div>`;
  // prochaine action
  if (!lastTest && !S.skipTest) h += `<div class="card" style="border-color:rgba(245,158,11,.4)"><div class="row"><div class="em" style="font-size:30px">🧪</div><div style="flex:1"><b>Faites le test de capacités</b><div class="mu small">15–25 min pour mesurer force, gainage, souplesse et cardio, puis recevoir un programme adapté.</div></div></div>
    <div class="grid2" style="margin-top:12px"><button class="btn pri" onclick="startTest()">${ic('test')}Commencer</button><button class="btn ghost" onclick="S.skipTest=true;save();render()">Plus tard</button></div></div>`;
  if (nx) h += `<div class="card"><div class="mu tiny" style="text-transform:uppercase;letter-spacing:.08em;font-weight:800">Prochaine séance · ${esc(nx.p.nom)}</div>
    <div class="row" style="margin-top:8px"><div class="em" style="font-size:28px">${SPORTS[nx.s.sport].ic}</div><div style="flex:1"><b style="font-size:17px">${esc(nx.s.nom)}</b><div class="mu small">${sessDesc(nx.s)}</div></div></div>
    <div class="pbar" style="margin:12px 0 6px"><i style="width:${Math.round(nx.done / nx.total * 100)}%"></i></div><div class="mu tiny">${nx.done}/${nx.total} séances du programme</div>
    <button class="btn pri w" style="margin-top:12px" onclick="startProgSession()">${ic('play')}Démarrer la séance</button></div>`;
  else if (lastTest || S.skipTest) h += `<div class="card"><div class="row"><div class="em" style="font-size:28px">📋</div><div style="flex:1"><b>Choisissez un programme</b><div class="mu small">${lastTest ? 'Votre niveau : ' + lastTest.levelTxt + '. Des programmes vous sont recommandés.' : 'Des séances prêtes à suivre selon votre objectif.'}</div></div></div><button class="btn w" style="margin-top:12px" onclick="go('programmes')">Voir les programmes</button></div>`;
  // calendrier
  h += `<h3 class="sec">Calendrier</h3><div class="card">${calendar()}</div>`;
  // sports pratiqués
  const P = practiced();
  h += `<h3 class="sec">Mes sports <a onclick="go('sports')">Tout voir</a></h3>`;
  h += P.length ? `<div class="sports">${P.map(k => spCard(k)).join('')}</div>` : `<div class="card empty"><div class="e">🏁</div>Enregistrez une première séance avec le bouton <b>+</b>.</div>`;
  // dernières séances
  const last = [...S.sessions].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 4);
  if (last.length) h += `<h3 class="sec">Dernières séances</h3>${last.map(sessRow).join('')}`;
  $('#view').innerHTML = h;
  weekChart();
}
function spCard(k) {
  const L = sessionsOf(k), m = new Date().getMonth(), y = new Date().getFullYear(), mo = L.filter(x => { const d = parseD(x.date); return d.getMonth() === m && d.getFullYear() === y; });
  const sp = SPORTS[k], extra = sp.dist ? `${mo.reduce((a, x) => a + distKm(x), 0).toFixed(1)} km` : hmin(mo.reduce((a, x) => a + (+x.dur || 0), 0));
  return `<button class="sp" style="--c:${sp.c}" onclick="go('sport',{sp:'${k}'})"><span class="e">${sp.ic}</span><span><b>${sp.nom}</b><br><small>${mo.length} ce mois · ${extra}</small></span></button>`;
}
function weekChart(k = 1) {
  const c = $('#weekChart'); if (!c) return; const W = c.width = c.clientWidth * 2, H = c.height = 240, x = c.getContext('2d'), a = monday(new Date());
  const days = [...Array(7)].map((_, i) => { const d = new Date(a); d.setDate(d.getDate() + i); return ymd(d); });
  const per = days.map(d => S.sessions.filter(s => s.date === d)), mx = Math.max(30, ...per.map(L => L.reduce((s, z) => s + (+z.dur || 0), 0)));
  const bw = W / 7, lab = ['L', 'M', 'M', 'J', 'V', 'S', 'D'];
  per.forEach((L, i) => {
    let y = H - 40; const x0 = i * bw + bw * .22, w = bw * .56;
    x.fillStyle = 'rgba(255,255,255,.06)'; roundRect(x, x0, 16, w, H - 56, 12); x.fill();
    L.forEach(s => { const h = (+s.dur || 0) / mx * (H - 60) * k; x.fillStyle = SPORTS[s.sport].c; roundRect(x, x0, y - h, w, Math.max(h, 6), 10); x.fill(); y -= h; });
    x.fillStyle = days[i] === today() ? '#4ade80' : '#64708a'; x.font = '700 22px -apple-system,system-ui'; x.textAlign = 'center'; x.fillText(lab[i], x0 + w / 2, H - 8);
  });
}
function roundRect(x, a, b, w, h, r) { r = Math.min(r, w / 2, h / 2); x.beginPath(); x.moveTo(a + r, b); x.arcTo(a + w, b, a + w, b + h, r); x.arcTo(a + w, b + h, a, b + h, r); x.arcTo(a, b + h, a, b, r); x.arcTo(a, b, a + w, b, r); x.closePath(); }
function calendar() {
  const y = calMonth.getFullYear(), m = calMonth.getMonth(), first = new Date(y, m, 1), start = monday(first), plan = plannedDays();
  let h = `<div class="cal-h"><button onclick="calMonth=new Date(${y},${m - 1},1);render()">${ic('left')}</button><b style="text-transform:capitalize">${first.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' })}</b><button onclick="calMonth=new Date(${y},${m + 1},1);render()">${ic('right')}</button></div><div class="cal">`;
  h += ['L', 'M', 'M', 'J', 'V', 'S', 'D'].map(d => `<div class="dn">${d}</div>`).join('');
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(d.getDate() + i); const k = ymd(d), L = S.sessions.filter(s => s.date === k);
    if (i >= 35 && d.getMonth() !== m) break;
    h += `<div class="d${d.getMonth() !== m ? ' out' : ''}${k === today() ? ' today' : ''}${L.length ? ' act' : ''}${plan.has(k) && !L.length ? ' plan' : ''}" onclick="openDay('${k}')"><span>${d.getDate()}</span><span class="dots">${[...new Set(L.map(s => s.sport))].map(s => `<i style="background:${SPORTS[s].c}"></i>`).join('')}</span></div>`;
  }
  const used = [...new Set(S.sessions.map(s => s.sport))];
  return h + `</div><div class="legend">${used.map(s => `<span><i style="background:${SPORTS[s].c}"></i>${SPORTS[s].nom}</span>`).join('')}${plan.size ? '<span><i style="border:1.5px solid var(--warn)"></i>Séance prévue</span>' : ''}</div>`;
}
// jours prévus par le programme suivi (selon la fréquence, à partir d'aujourd'hui)
function plannedDays() {
  const set = new Set(); if (!S.prog) return set; const p = PROGRAMS.find(x => x.id === S.prog.id); if (!p) return set;
  const pattern = { 2: [1, 4], 3: [0, 2, 4], 4: [0, 1, 3, 4], 5: [0, 1, 2, 4, 5] }[p.freq] || [0, 2, 4];
  const a = monday(new Date()); for (let w = 0; w < 6; w++) pattern.forEach(i => { const d = new Date(a); d.setDate(d.getDate() + w * 7 + i); if (ymd(d) >= today()) set.add(ymd(d)); });
  return set;
}
function sessDesc(s) { return s.items ? s.items.slice(0, 4).map(mvName).join(' · ') + (s.items.length > 4 ? ' …' : '') : (s.blocks || []).map(b => b.d).join(' · ').slice(0, 90); }
function sessRow(s) {
  const sp = SPORTS[s.sport], info = [s.dur ? hmin(s.dur) : '', s.dist ? (sp.dist === 'm' ? s.dist + ' m' : (+s.dist).toFixed(2) + ' km') : '', s.items ? s.items.length + ' exos' : '', s.rpe ? 'RPE ' + s.rpe : ''].filter(Boolean).join(' · ');
  return `<button class="li" onclick="openSession('${s.id}')"><span class="em" style="background:${sp.c}22">${sp.ic}</span><span class="t"><b>${esc(s.nom || sp.nom)}</b><small>${fmtDate(s.date, { weekday: 'short', day: 'numeric', month: 'short' })} · ${info}</small></span><span class="chev">${ic('right')}</span></button>`;
}
function openDay(k) {
  const L = S.sessions.filter(s => s.date === k);
  sheet(`<h2 style="text-transform:capitalize">${fmtDate(k)}</h2><p class="mu small">${L.length ? L.length + ' séance(s)' : 'Aucune séance ce jour-là.'}</p>${L.map(sessRow).join('')}
    <button class="btn pri w" style="margin-top:14px" onclick="closeSheet();logForm(null,'${k}')">${ic('plus')}Ajouter une séance ce jour</button>`);
}
function openSession(id) {
  const s = S.sessions.find(x => x.id === id); if (!s) return; const sp = SPORTS[s.sport];
  let h = `<h2>${sp.ic} ${esc(s.nom || sp.nom)}</h2><p class="mu small" style="text-transform:capitalize">${fmtDate(s.date)}</p><div class="grid3" style="margin-top:10px">
    <div class="kpi"><div class="l">Durée</div><div class="v">${s.dur ? hmin(s.dur) : '—'}</div></div>
    <div class="kpi"><div class="l">${s.items ? 'Volume' : 'Distance'}</div><div class="v">${s.items ? Math.round(volKg(s)) + '<small> kg</small>' : s.dist ? (sp.dist === 'm' ? s.dist + '<small> m</small>' : (+s.dist).toFixed(2) + '<small> km</small>') : '—'}</div></div>
    <div class="kpi"><div class="l">Ressenti</div><div class="v">${s.rpe ? s.rpe + '<small>/10</small>' : '—'}</div></div></div>`;
  if (s.sport === 'course' && s.dist && s.dur) h += `<p class="mu small">Allure moyenne : <b style="color:var(--tx)">${pace(s.dur / s.dist)}/km</b>${s.deniv ? ' · D+ ' + s.deniv + ' m' : ''}</p>`;
  if (s.items) h += s.items.map(it => `<div class="kpi" style="margin-top:8px"><b>${esc(mvName(it))}</b><div class="mu small" style="margin-top:4px">${it.sets.filter(z => z.done).map(z => z.sec ? z.sec + ' s' : (z.reps || 0) + (z.kg ? ' × ' + z.kg + ' kg' : ' reps')).join(' · ') || 'Aucune série validée'}</div></div>`).join('');
  if (s.blocks) h += s.blocks.map(b => `<div class="kpi" style="margin-top:8px"><b>${esc(b.t)}</b><div class="mu small">${esc(b.d)}</div></div>`).join('');

const avgRpe = L => { const r = L.filter(x => x.rpe); return r.length ? (r.reduce((a, x) => a + +x.rpe, 0) / r.length).toFixed(1) + '<small>/10</small>' : '—'; };
function records(k, L) {

    const lg = L.reduce((a, x) => distKm(x) > distKm(a) ? x : a, L[0]); R.push(['Plus longue', sp.dist === 'm' ? lg.dist + ' m' : distKm(lg).toFixed(2) + ' km', lg.date]);
    if (k === 'course') { const r = L.filter(x => x.dist >= 3 && x.dur); if (r.length) { const b = r.reduce((a, x) => x.dur / x.dist < a.dur / a.dist ? x : a); R.push(['Meilleure allure (≥ 3 km)', pace(b.dur / b.dist) + '/km', b.date]); } }

let chartExo = null;

function spChart(k, L) {
  const c = $('#spChart'); if (!c) return; const sp = SPORTS[k]; let pts = [], lab = '';
  if (k === 'muscu' && chartExo) {
    pts = [...L].reverse().map(x => { const it = (x.items || []).find(i => i.mv === chartExo); if (!it) return null; const v = Math.max(0, ...it.sets.filter(z => z.done && z.kg).map(z => e1rm(+z.kg, +z.reps || 1))); return v ? [x.date, v] : null; }).filter(Boolean);
    lab = '1RM estimé (kg) — formule d’Epley, par séance';
  } else { // par semaine sur 12 semaines
    const a = monday(new Date()); a.setDate(a.getDate() - 77);
    for (let w = 0; w < 12; w++) { const s0 = new Date(a); s0.setDate(s0.getDate() + w * 7); const s1 = new Date(s0); s1.setDate(s1.getDate() + 7); const W = L.filter(x => { const d = parseD(x.date); return d >= s0 && d < s1; }); pts.push([ymd(s0), sp.dist ? W.reduce((s, x) => s + distKm(x), 0) : W.reduce((s, x) => s + (+x.dur || 0), 0)]); }
    lab = sp.dist ? 'Kilomètres par semaine (12 dernières semaines)' : 'Minutes par semaine (12 dernières semaines)';

function drawLine(c, pts, col, bars) {
  const W = c.width = c.clientWidth * 2, H = c.height = 400, x = c.getContext('2d'), P = 60; x.clearRect(0, 0, W, H);
  if (!pts.length) { x.fillStyle = '#64708a'; x.font = '26px system-ui'; x.textAlign = 'center'; x.fillText('Pas encore assez de données', W / 2, H / 2); return; }
  const mx = Math.max(1, ...pts.map(p => p[1])) * 1.15, n = pts.length, X = i => P + (n === 1 ? (W - P - 20) / 2 : i * (W - P - 20) / (n - 1)), Y = v => H - 40 - v / mx * (H - 70);
  x.strokeStyle = 'rgba(255,255,255,.06)'; x.fillStyle = '#64708a'; x.font = '20px system-ui'; x.textAlign = 'right';
  for (let k = 0; k <= 3; k++) { const v = mx * k / 3; x.beginPath(); x.moveTo(P, Y(v)); x.lineTo(W - 10, Y(v)); x.stroke(); x.fillText(v >= 100 ? Math.round(v) : v.toFixed(1), P - 8, Y(v) + 7); }
  x.textAlign = 'center'; pts.forEach((p, i) => { if (n <= 8 || i % Math.ceil(n / 6) === 0) x.fillText(parseD(p[0]).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }), X(i), H - 10); });
  if (bars) { const bw = Math.min(46, (W - P) / n * .6); pts.forEach((p, i) => { x.fillStyle = col; x.globalAlpha = p[0] >= ymd(monday(new Date())) ? 1 : .55; roundRect(x, X(i) - bw / 2, Y(p[1]), bw, Math.max(4, H - 40 - Y(p[1])), 8); x.fill(); }); x.globalAlpha = 1; return; }

  x.beginPath(); pts.forEach((p, i) => i ? x.lineTo(X(i), Y(p[1])) : x.moveTo(X(i), Y(p[1]))); x.lineTo(X(n - 1), H - 40); x.lineTo(X(0), H - 40); x.fillStyle = g; x.fill();
  x.beginPath(); pts.forEach((p, i) => i ? x.lineTo(X(i), Y(p[1])) : x.moveTo(X(i), Y(p[1]))); x.strokeStyle = col; x.lineWidth = 5; x.stroke();
  pts.forEach((p, i) => { x.beginPath(); x.arc(X(i), Y(p[1]), 7, 0, 7); x.fillStyle = col; x.fill(); });
}

function addSet(i) { const s = L.items[i].sets, p = s.at(-1) || { reps: 10, kg: '' }; s.push(p.sec != null ? { sec: p.sec } : { reps: p.reps, kg: p.kg }); renderLive(); }

  const it = L.items[i], z = it.sets[j];

  if (z.kg && z.reps) {
    const v = e1rm(+z.kg, +z.reps); let best = 0;
    S.sessions.forEach(s => (s.items || []).forEach(x => { if (x.mv === it.mv) x.sets.forEach(q => { if (q.done && q.kg && q.reps) best = Math.max(best, e1rm(+q.kg, +q.reps)); }); }));
    if (best && v > best + 0.01 && !z.pr) { z.pr = true; confetti(70); toast(`🏅 Nouveau record sur ${mvName(it)} ! 1RM ≈ ${Math.round(v)} kg`, 3500); haptic([30, 40, 30]); }

function nextLabel(i, j) { const it = L.items[i]; if (j + 1 < it.sets.length) return `${mvName(it)} — série ${j + 2}`; const n = L.items[i + 1]; return n ? `${mvName(n)} — série 1` : 'Dernière série faite 💪'; }

  h += S.goals.map(g => { const r = goalProgress(g); return `<div class="card"><div class="row" style="justify-content:space-between"><b>${esc(g.titre)}</b><button class="btn sm ghost" onclick="S.goals=S.goals.filter(x=>x.id!=='${g.id}');save();render()">${ic('trash')}</button></div>
    <div class="pbar" style="margin:10px 0 6px"><i style="width:${r.p * 100}%"></i></div><div class="row" style="justify-content:space-between"><span class="mu small">${g.type === 'km' ? r.v.toFixed(1) : Math.round(r.v)} / ${g.target} ${g.type === 'km' ? 'km' : g.type === 'minutes' ? 'min' : 'séances'}</span>${r.p >= 1 ? '<span class="pill ok">Réussi ✓</span>' : `<span class="pill dan">Pénalité : ${esc(g.penalite || '—')}</span>`}</div></div>`; }).join('') || '<div class="card empty">Aucun objectif.</div>';
  if (missed.length) h += `<div class="card" style="border-color:rgba(244,63,94,.4)"><b>⚠️ Semaine dernière : objectif manqué</b><div class="mu small" style="margin-top:6px">${missed.map(g => `${esc(g.titre)} → <b style="color:#fda4af">${esc(g.penalite)}</b>`).join('<br>')}</div></div>`;
  h += `<h3 class="sec">Tests de capacités</h3>${S.tests.length ? S.tests.map((t, i) => `<button class="li" onclick="showTest(${i})"><span class="em">🧪</span><span class="t"><b>${t.levelTxt} · ${t.avg.toFixed(1)}/5</b><small>${fmtDate(t.date, { day: 'numeric', month: 'long', year: 'numeric' })}</small></span>${ic('right')}</button>`).reverse().join('') : ''}<button class="btn w" style="margin-top:8px" onclick="startTest()">${ic('test')}${S.tests.length ? 'Refaire le test (conseillé toutes les 6 semaines)' : 'Faire le test'}</button>`;
  h += `<h3 class="sec">Données</h3><div class="card"><p class="mu small" style="margin-top:0">Vos données restent sur cet appareil. Sauvegardez-les régulièrement.</p><div class="grid2"><button class="btn" onclick="exportData()">⬇️ Sauvegarder</button><label class="btn" style="cursor:pointer">⬆️ Restaurer<input type="file" accept=".json" hidden onchange="importData(this.files[0])"></label></div>
    <button class="btn dan w" style="margin-top:8px" onclick="if(confirm('Effacer toutes les données ?')&&confirm('Vraiment tout effacer ?')){localStorage.removeItem(KEY);localStorage.removeItem('apexfit_state');S=blank();save();render()}">Tout effacer</button></div>
    <p class="mu tiny" style="text-align:center;margin:18px 0">ApexFit v3.2 · données 100 % locales<br>Photos d’exercices : free-exercise-db (domaine public)</p>`;
  $('#view').innerHTML = h;
}
function editProfile() {
  const P = S.profile;
  sheet(`<h2>Mon profil</h2><div class="grid2"><label class="f">Prénom<input class="in" id="pP" value="${esc(P.prenom)}"></label><label class="f">Âge<input class="in" type="number" id="pA" value="${P.age || ''}"></label></div>
    <label class="f">Objectif<select class="in" id="pO">${Object.entries(OBJ).map(([k, v]) => `<option value="${k}" ${P.obj === k ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
    <label class="f">Séances visées par semaine<input class="in" type="number" min="1" max="7" id="pJ" value="${P.jours}"></label>
    <button class="btn pri w" style="margin-top:14px" onclick="Object.assign(S.profile,{prenom:$('#pP').value.trim(),age:+$('#pA').value||30,obj:$('#pO').value,jours:clamp(+$('#pJ').value||3,1,7)});save();closeSheet();render()">Enregistrer</button>`);
}
function goalForm() {
  sheet(`<h2>Nouvel objectif hebdo</h2><label class="f">Type<select class="in" id="gT"><option value="seances">Nombre de séances</option><option value="km">Kilomètres</option><option value="minutes">Minutes d’activité</option></select></label>
    <label class="f">Sport<select class="in" id="gS"><option value="all">Tous les sports</option>${Object.keys(SPORTS).map(k => `<option value="${k}">${SPORTS[k].nom}</option>`).join('')}</select></label>
    <label class="f">Cible par semaine<input class="in" type="number" id="gV" value="3"></label><label class="f">Pénalité si raté<input class="in" id="gP" placeholder="Ex. : 50 burpees"></label>
    <button class="btn pri w" style="margin-top:14px" onclick="goalAdd()">Ajouter</button>`);
}
function goalAdd() {
  const t = $('#gT').value, sp = $('#gS').value, v = +$('#gV').value; if (!v) return toast('Indiquez une cible');
  S.goals.push({ id: uid(), type: t, sport: sp, target: v, penalite: $('#gP').value.trim() || '—', titre: `${v} ${t === 'km' ? 'km' : t === 'minutes' ? 'min' : 'séances'}${sp === 'all' ? '' : ' de ' + SPORTS[sp].nom.toLowerCase()} par semaine` }); save(); closeSheet(); render();
}
function exportData() { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S)], { type: 'application/json' })); a.download = `apexfit_${today()}.json`; a.click(); }
function importData(f) { if (!f) return; f.text().then(t => { const d = JSON.parse(t); if (d.v !== 3) throw 0; S = Object.assign(blank(), d); save(); render(); toast('Données restaurées ✅'); }).catch(() => toast('Fichier invalide')); }

// ===================== INTERACTIONS DYNAMIQUES =====================
const haptic = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
let lastKey = '';
function enhance() {
  const key = route.v + (route.sp || '') + (route.v === 'sport' ? spTab : '') + (route.v === 'programmes' ? progF : '');
  const fresh = key !== lastKey; lastKey = key;
  if (fresh && !reduced()) {
    [...$('#view').children].forEach((el, i) => { el.style.setProperty('--i', Math.min(i, 12)); el.classList.add('rise'); });
    countUp(); fillBars(); ringFill();
    if ($('#weekChart')) { const t0 = performance.now(); const st = t => { const k = Math.min(1, (t - t0) / 700); weekChart(1 - Math.pow(1 - k, 3)); if (k < 1) requestAnimationFrame(st); }; requestAnimationFrame(st); }
  }
  const cal = $('#view .cal'); if (cal) swipeCal(cal.parentElement);
  $$('#view .li[onclick^="openSession"]').forEach(swipeDelete);
}
// chiffres qui défilent jusqu'à leur valeur
function countUp() {
  $$('#view .kpi .v, #view .ring b, #view .hero [data-count]').forEach(el => {
    const tn = [...el.childNodes].find(n => n.nodeType === 3 && /\d/.test(n.textContent)); if (!tn) return;
    const m = tn.textContent.match(/(\d+(?:[.,]\d+)?)/); if (!m) return;
    const target = parseFloat(m[1].replace(',', '.')), dec = (m[1].split(/[.,]/)[1] || '').length, pre = tn.textContent.slice(0, m.index), post = tn.textContent.slice(m.index + m[1].length);
    if (!target) return; const t0 = performance.now(), D = 800;
    const st = t => { const k = Math.min(1, (t - t0) / D), v = target * (1 - Math.pow(1 - k, 3)); tn.textContent = pre + v.toFixed(dec) + post; if (k < 1) requestAnimationFrame(st); };
    requestAnimationFrame(st);
  });
}
function fillBars() { $$('#view .pbar i').forEach(i => { const w = i.style.width; i.style.width = '0'; requestAnimationFrame(() => requestAnimationFrame(() => { i.style.width = w; })); }); }
function ringFill() { const r = $('#view .ring'); if (!r) return; const p = +getComputedStyle(r).getPropertyValue('--p') || 0, t0 = performance.now(); const st = t => { const k = Math.min(1, (t - t0) / 900); r.style.setProperty('--p', (p * (1 - Math.pow(1 - k, 3))).toFixed(1)); if (k < 1) requestAnimationFrame(st); }; requestAnimationFrame(st); }
// calendrier : balayer pour changer de mois
function swipeCal(box) {
  if (box.dataset.sw) return; box.dataset.sw = 1; let x0 = null, y0 = 0;
  box.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  box.addEventListener('touchend', e => { if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + (dx < 0 ? 1 : -1), 1); haptic(8); render(); const c = $('#view .cal'); if (c) c.classList.add(dx < 0 ? 'slideL' : 'slideR'); } });
}
// séance : balayer vers la gauche pour supprimer (avec annulation)
function swipeDelete(el) {
  if (el.dataset.sw) return; el.dataset.sw = 1; let x0 = null, y0 = 0, dx = 0, moved = false;
  const id = (el.getAttribute('onclick').match(/openSession\('([^']+)'\)/) || [])[1]; if (!id) return;
  el.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = 0; moved = false; el.style.transition = 'none'; }, { passive: true });
  el.addEventListener('touchmove', e => { if (x0 == null) return; dx = Math.min(0, e.touches[0].clientX - x0); if (Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(e.touches[0].clientY - y0)) { moved = true; el.style.transform = `translateX(${dx}px)`; el.style.boxShadow = `inset ${-dx}px 0 0 rgba(244,63,94,${Math.min(.5, -dx / 300)})`; } }, { passive: true });
  el.addEventListener('touchend', () => { if (x0 == null) return; x0 = null; el.style.transition = 'transform .25s, box-shadow .25s';
    if (dx < -110) { el.style.transform = 'translateX(-110%)'; haptic(20); setTimeout(() => deleteWithUndo(id), 220); } else { el.style.transform = ''; el.style.boxShadow = ''; } });
  el.addEventListener('click', e => { if (moved) { e.stopImmediatePropagation(); e.preventDefault(); } }, true);
}
function deleteWithUndo(id) {
  const i = S.sessions.findIndex(x => x.id === id); if (i < 0) return; const [s] = S.sessions.splice(i, 1); save(); lastKey = ''; render();
  const d = document.createElement('div'); d.className = 'toast'; d.innerHTML = `Séance supprimée <button class="btn sm" style="margin-left:10px;padding:6px 10px">Annuler</button>`; document.body.appendChild(d);
  d.querySelector('button').onclick = () => { S.sessions.splice(i, 0, s); save(); lastKey = ''; render(); d.remove(); haptic(10); };
  setTimeout(() => d.remove(), 5000);
}
// confettis
function confetti(n = 100) {
  if (reduced()) return; const c = document.createElement('canvas'), W = c.width = innerWidth * 2, H = c.height = innerHeight * 2, x = c.getContext('2d');
  c.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:300'; document.body.appendChild(c);
  const col = ['#22c55e', '#4ade80', '#14b8a6', '#facc15', '#818cf8', '#f472b6', '#fb923c'];
  const P = Array.from({ length: n }, () => ({ x: W / 2 + (Math.random() - .5) * W * .3, y: H * .55, vx: (Math.random() - .5) * 34, vy: -Math.random() * 46 - 18, r: Math.random() * 10 + 6, a: Math.random() * 6, va: (Math.random() - .5) * .4, c: col[Math.random() * col.length | 0] }));
  const t0 = performance.now(); const st = t => { x.clearRect(0, 0, W, H); P.forEach(p => { p.vy += 1.4; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); x.restore(); });
    if (t - t0 < 2200) requestAnimationFrame(st); else c.remove(); }; requestAnimationFrame(st);
}
// petite vibration à chaque bouton (Android ; ignoré sur iPhone)
document.addEventListener('pointerdown', e => { if (e.target.closest('button, .li, .sp, .d, .block')) haptic(6); }, { passive: true });

// ===================== DÉMARRAGE =====================
$('#nav').innerHTML = `<button data-v="home" onclick="go('home')">${ic('home')}Accueil</button><button data-v="sports" onclick="go('sports')">${ic('grid')}Sports</button>
  <button class="plus" onclick="plusMenu()" aria-label="Nouvelle séance">${ic('plus')}</button><button data-v="programmes" onclick="go('programmes')">${ic('list')}Programmes</button><button data-v="profil" onclick="go('profil')">${ic('user')}Profil</button>`;
save(); render();
window.addEventListener('resize', () => { if (route.v === 'home') weekChart(); });
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});

</script>
