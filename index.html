<!DOCTYPE html>
<html lang="fr">
<head>
<!-- ApexFit — © rinate83 — https://github.com/rinate83/sport-suivi- — empreinte : apexfit-rinate83-7f3c9e -->
<meta name="author" content="rinate83">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ApexFit">
<title>ApexFit — Suivi sportif, programmes et test de capacités</title>
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#070b14;--bg2:#0c1220;--card:#111827;--card2:#162033;--line:#1f2a3d;--line2:#2b3850;--tx:#eef2f9;--mu:#93a0b8;--dim:#64708a;
--ac:#22c55e;--ac2:#4ade80;--in:#818cf8;--warn:#f59e0b;--dan:#f43f5e;--r:20px;--nav:74px;
--grad:linear-gradient(135deg,#22c55e,#14b8a6)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;background:var(--bg);color:var(--tx)}
body{margin:0;min-height:100vh;padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 14px);
background:radial-gradient(900px 420px at 100% -10%,rgba(34,197,94,.13),transparent 60%),radial-gradient(800px 380px at -10% 0,rgba(129,140,248,.12),transparent 60%),var(--bg);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:22px;height:22px;flex:none}
.hidden{display:none!important}
/* en-tête */
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:rgba(7,11,20,.78);backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px);border-bottom:1px solid rgba(31,42,61,.6)}
.top img{width:38px;height:38px;border-radius:11px}
.top b{font-size:18px;letter-spacing:-.02em}.top b span{color:var(--ac)}
.top small{display:block;color:var(--mu);font-size:12px}
.top .back{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer}
.streak{margin-left:auto;display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:13px}
main{max-width:980px;margin:0 auto;padding:16px}
h1.vt{font-size:26px;letter-spacing:-.03em;margin:4px 2px 14px}
h2{font-size:17px;margin:0;letter-spacing:-.01em}
h3.sec{font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);margin:22px 4px 10px;display:flex;align-items:center;justify-content:space-between}
h3.sec a{color:var(--ac);text-transform:none;letter-spacing:0;font-size:13.5px;font-weight:650;cursor:pointer}
.card{background:linear-gradient(180deg,var(--card),#0f1624);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:0 10px 30px -18px rgba(0,0,0,.7)}
.card+.card{margin-top:12px}
.row{display:flex;align-items:center;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(min-width:760px){.cols{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;align-items:start}}
.mu{color:var(--mu)}.small{font-size:13px}.tiny{font-size:11.5px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:99px;font-size:12px;font-weight:650;background:var(--card2);border:1px solid var(--line);color:var(--mu)}
.pill.ok{color:#86efac;border-color:rgba(34,197,94,.35);background:rgba(34,197,94,.1)}
.pill.warn{color:#fcd34d;border-color:rgba(245,158,11,.35);background:rgba(245,158,11,.1)}
.pill.dan{color:#fda4af;border-color:rgba(244,63,94,.35);background:rgba(244,63,94,.1)}
/* tuiles stats */
.kpi{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:12px}
.kpi .l{font-size:11.5px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:4px}.kpi .v small{font-size:13px;color:var(--mu);font-weight:600}
/* héro récap */
.hero{position:relative;overflow:hidden;background:linear-gradient(140deg,#0f2a1d,#0d1b2e 60%,#18153a);border:1px solid rgba(34,197,94,.25)}
.hero:after{content:'';position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(34,197,94,.35),transparent 70%)}
.ring{--p:0;width:96px;height:96px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--ac) calc(var(--p)*1%),rgba(255,255,255,.08) 0);position:relative}
.ring:before{content:'';position:absolute;inset:9px;border-radius:50%;background:#0d1a26}
.ring b{position:relative;font-size:22px}.ring small{position:relative;display:block;font-size:11px;color:var(--mu);text-align:center;margin-top:-4px}
/* calendrier */
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-h button{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:var(--card2);cursor:pointer;display:grid;place-items:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .dn{font-size:11px;color:var(--dim);text-align:center;font-weight:700;padding:4px 0}
.cal .d{aspect-ratio:1/1.05;border-radius:12px;background:rgba(255,255,255,.025);border:1px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:5px 2px;font-size:13px;font-weight:650;cursor:pointer;position:relative}
.cal .d.out{opacity:.25}.cal .d.today{border-color:var(--ac);color:var(--ac2)}
.cal .d.act{background:linear-gradient(180deg,rgba(34,197,94,.16),rgba(34,197,94,.04))}
.cal .d.plan:after{content:'';position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;border:1.5px solid var(--warn)}
.dots{display:flex;gap:2px;justify-content:center;flex-wrap:wrap;min-height:7px}.dots i{width:6px;height:6px;border-radius:50%}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.legend span{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--mu)}.legend i{width:8px;height:8px;border-radius:50%}
/* listes */
.li{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--card2);border:1px solid var(--line);cursor:pointer;width:100%;text-align:left}
.li+.li{margin-top:8px}
.li .em{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:21px;flex:none;background:rgba(255,255,255,.05)}
.li .t{flex:1;min-width:0}.li .t b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.li .t small{display:block;color:var(--mu);font-size:12.5px;margin-top:2px}
.li .chev{color:var(--dim)}
.sports{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.sports{grid-template-columns:repeat(4,1fr)}}
.sp{position:relative;overflow:hidden;border-radius:18px;padding:14px;border:1px solid var(--line);background:var(--card);cursor:pointer;text-align:left;min-height:118px;display:flex;flex-direction:column;justify-content:space-between}
.sp:before{content:'';position:absolute;inset:0;background:radial-gradient(160px 120px at 100% 0,var(--c),transparent 70%);opacity:.28}
.sp .e{font-size:30px;position:relative}.sp b{position:relative;font-size:15px}.sp small{position:relative;color:var(--mu);font-size:12px}
.sp.off{opacity:.45}
/* onglets segment */
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--card2);border:1px solid var(--line);margin:14px 0}
.seg button{flex:1;padding:10px 6px;border-radius:11px;border:0;background:transparent;color:var(--mu);font-weight:650;font-size:13.5px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 2px 10px rgba(0,0,0,.4)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 13px;border-radius:99px;border:1px solid var(--line);background:var(--card2);color:var(--mu);font-size:13px;font-weight:650;cursor:pointer}
.chip.on{background:rgba(34,197,94,.14);border-color:rgba(34,197,94,.5);color:#86efac}
/* boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 16px;border-radius:15px;border:1px solid var(--line2);background:var(--card2);font-weight:700;font-size:15px;cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.45}
.btn.pri{background:var(--grad);border-color:transparent;color:#04220f;box-shadow:0 10px 24px -12px rgba(34,197,94,.9)}
.btn.dan{color:#fda4af;border-color:rgba(244,63,94,.35);background:rgba(244,63,94,.08)}
.btn.w{width:100%}.btn.sm{padding:9px 12px;font-size:13.5px;border-radius:12px}
.btn.ghost{background:transparent}
/* formulaires */
label.f{display:block;font-size:12.5px;color:var(--mu);font-weight:650;margin-top:12px}
.in,select.in,textarea.in{width:100%;margin-top:6px;padding:12px 13px;border-radius:13px;border:1px solid var(--line2);background:#0a1120;color:var(--tx);font-size:16px;-webkit-appearance:none;appearance:none}
.in:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px rgba(34,197,94,.18)}
textarea.in{min-height:70px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--ac)}
/* barre d'onglets */
.nav{position:fixed;z-index:50;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));height:66px;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:6px;border-radius:24px;background:rgba(17,24,39,.86);backdrop-filter:saturate(1.6) blur(20px);-webkit-backdrop-filter:saturate(1.6) blur(20px);border:1px solid var(--line2);box-shadow:0 16px 40px -12px rgba(0,0,0,.8);max-width:560px;margin:0 auto}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:var(--dim);font-size:11px;font-weight:700;cursor:pointer;padding:6px 0;border-radius:16px}
.nav button.on{color:var(--ac2)}
.nav .plus{width:54px;height:54px;margin:auto;border-radius:18px;background:var(--grad);color:#04220f;box-shadow:0 10px 24px -8px rgba(34,197,94,.9);justify-content:center}
.nav .plus svg{width:28px;height:28px}
/* feuilles (modales) */
.sheet-bg{position:fixed;inset:0;z-index:80;background:rgba(2,6,14,.6);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;animation:fd .2s}
.sheet{width:100%;max-width:620px;max-height:92vh;overflow:auto;background:#0e1524;border:1px solid var(--line2);border-radius:26px 26px 0 0;padding:8px 18px calc(18px + env(safe-area-inset-bottom));animation:up .25s cubic-bezier(.2,.8,.2,1)}
@media(min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:26px}}
.sheet .grab{width:42px;height:5px;border-radius:5px;background:var(--line2);margin:4px auto 12px}
.sheet h2{font-size:21px;margin-bottom:4px}
@keyframes up{from{transform:translateY(40px);opacity:0}}@keyframes fd{from{opacity:0}}
/* séance en direct */
.live{position:fixed;inset:0;z-index:70;background:var(--bg);overflow:auto;padding-bottom:140px}
.live .lh{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:rgba(7,11,20,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.live .clock{font-variant-numeric:tabular-nums;font-weight:800;font-size:18px;color:var(--ac2)}
.ex{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:12px 16px 0}
.ex .eh{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.ex .eh b{font-size:16px;flex:1}
.ex .last{font-size:12px;color:var(--mu);margin:-4px 0 8px}
.set{display:grid;grid-template-columns:32px 1fr 1fr 48px;gap:8px;align-items:center;margin-top:7px}
.set.t3{grid-template-columns:32px 1fr 48px}
.set .n{font-weight:800;color:var(--dim);text-align:center}
.set input{width:100%;padding:11px 8px;border-radius:12px;border:1px solid var(--line2);background:#0a1120;text-align:center;font-size:16px;font-weight:700}
.set .ok{height:44px;border-radius:13px;border:1px solid var(--line2);background:var(--card2);cursor:pointer;display:grid;place-items:center;color:var(--dim)}
.set.done .ok{background:var(--ac);color:#04220f;border-color:transparent}
.set.done input{border-color:rgba(34,197,94,.4);color:#86efac}
.set .lab{font-size:11px;color:var(--dim);text-align:center}
.restbar{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:75;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:20px;background:#0f2a1d;border:1px solid rgba(34,197,94,.5);box-shadow:0 18px 40px -10px rgba(0,0,0,.8)}
.restbar .big{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ac2);min-width:76px}
.restbar .prog{position:absolute;left:0;bottom:0;height:3px;background:var(--ac);border-radius:3px}
.block{display:flex;gap:12px;align-items:flex-start;padding:13px;border-radius:16px;background:var(--card2);border:1px solid var(--line);margin-top:8px;cursor:pointer}
.block .ck{width:26px;height:26px;border-radius:9px;border:2px solid var(--line2);flex:none;display:grid;place-items:center}
.block.done .ck{background:var(--ac);border-color:var(--ac);color:#04220f}
.block.done b{text-decoration:line-through;color:var(--mu)}
.bigclock{font-size:56px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.03em;margin:8px 0}
/* bibliothèque */
.mv{display:flex;gap:12px;align-items:center}
.lvl{display:inline-flex;gap:2px}.lvl i{width:6px;height:12px;border-radius:2px;background:var(--line2)}.lvl i.on{background:var(--ac)}
ol.how{padding-left:20px;margin:8px 0}ol.how li{margin:6px 0;line-height:1.45}
ul.err{padding-left:18px;margin:6px 0;color:#fda4af}ul.err li{margin:4px 0}
.tip{padding:12px 14px;border-radius:14px;background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.25);color:#bbf7d0;font-size:14px;margin-top:10px}
/* barres */
.pbar{height:8px;border-radius:8px;background:rgba(255,255,255,.07);overflow:hidden}.pbar i{display:block;height:100%;background:var(--grad);border-radius:inherit}
canvas.ch{width:100%;display:block}
/* notifications */
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 22px);transform:translateX(-50%);z-index:200;background:#1f2937;border:1px solid var(--line2);color:#fff;padding:12px 16px;border-radius:14px;font-weight:650;font-size:14px;box-shadow:0 16px 30px -10px rgba(0,0,0,.8);max-width:92%;animation:up .25s}
.empty{text-align:center;padding:26px 12px;color:var(--mu)}.empty .e{font-size:38px}
.test-step{font-size:12px;color:var(--ac2);font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.choice{display:grid;gap:8px;margin-top:10px}.choice button{text-align:left}
.choice button.on{border-color:var(--ac);background:rgba(34,197,94,.12)}
.score{display:flex;align-items:center;gap:10px;margin-top:8px}.score span{flex:1;font-size:14px}.score .pbar{flex:1.3}

/* images des mouvements */
.mvimg{position:relative;display:block;overflow:hidden;background:#e2e8f0;flex:none}
.mvimg img{display:block;width:100%;height:100%;object-fit:cover}
.mvimg.anim img:nth-child(2){position:absolute;inset:0;animation:frame 2.4s steps(1) infinite}
@keyframes frame{0%{opacity:0}50%{opacity:1}}
.mvimg.thumb{width:56px;height:56px;border-radius:14px}
.mvimg.big{width:100%;aspect-ratio:4/3;border-radius:18px;margin:4px 0 10px}
.mvimg.big img{object-fit:contain;background:#f1f5f9}
.ex .eh .mvimg.thumb{width:48px;height:48px;border-radius:12px}

/* ===== interactions dynamiques ===== */
.rise{animation:rise .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 45ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.btn,.li,.sp,.chip,.nav button,.cal .d,.block{transition:transform .12s ease,background .2s,border-color .2s}
.li:active,.sp:active,.cal .d:active,.block:active{transform:scale(.97)}
.chip:active,.nav button:active{transform:scale(.92)}
.nav .plus{transition:transform .2s cubic-bezier(.3,1.6,.5,1)}.nav .plus:active{transform:scale(.88) rotate(90deg)}
.nav button.on svg{animation:navpop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes navpop{40%{transform:translateY(-4px) scale(1.15)}}
.streak.hot svg{color:#fb923c;animation:flame 1.6s ease-in-out infinite;transform-origin:50% 90%}
@keyframes flame{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.15) rotate(3deg);filter:drop-shadow(0 0 6px rgba(251,146,60,.8))}}
.pbar i{transition:width .9s cubic-bezier(.2,.8,.2,1)}
.cal.slideL{animation:slL .3s ease}.cal.slideR{animation:slR .3s ease}
@keyframes slL{from{opacity:0;transform:translateX(30px)}}@keyframes slR{from{opacity:0;transform:translateX(-30px)}}
.cal .d.today{animation:today 2.4s ease-in-out infinite}
@keyframes today{50%{box-shadow:0 0 0 4px rgba(34,197,94,.18)}}
.set.pop .ok{animation:pop .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.ex{transition:border-color .4s,box-shadow .4s}
.ex.allDone{border-color:rgba(34,197,94,.55);box-shadow:0 0 0 1px rgba(34,197,94,.25),0 10px 30px -12px rgba(34,197,94,.5)}
.ex.allDone .eh b:after{content:'  ✓';color:var(--ac2)}
.restbar{animation:up .3s cubic-bezier(.2,.8,.2,1)}
.restbar.last{animation:beat .5s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.03);box-shadow:0 0 0 6px rgba(34,197,94,.25)}}
.block.done .ck{animation:pop .4s cubic-bezier(.3,1.8,.5,1)}
.sheet{will-change:transform}
.sheet .grab{width:48px;height:6px;cursor:grab}
.sp:hover .e,.sp:active .e{transform:scale(1.12) rotate(-6deg)}.sp .e{transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.kpi{transition:transform .2s}.kpi:active{transform:scale(.97)}
.choice button.on{animation:pop .35s cubic-bezier(.3,1.8,.5,1)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* progression, corps, rappels */
.sug{font-size:12.5px;font-weight:700;margin:-2px 0 8px;padding:6px 10px;border-radius:10px;background:rgba(148,163,184,.1);color:var(--mu)}
.sug.up{background:rgba(34,197,94,.12);color:#86efac}.sug.down{background:rgba(245,158,11,.12);color:#fcd34d}
.todaycard{border-color:rgba(245,158,11,.5);background:linear-gradient(135deg,#2a1d07,#111827)}
.bell{font-size:26px;animation:ring 2.5s ease-in-out infinite;transform-origin:50% 0}
@keyframes ring{0%,60%,100%{transform:rotate(0)}10%{transform:rotate(14deg)}20%{transform:rotate(-12deg)}30%{transform:rotate(8deg)}40%{transform:rotate(-4deg)}}
canvas.spark{width:100px;height:30px}
.thumbs{display:flex;gap:8px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.th{flex:none;width:86px;border:0;background:none;padding:0;cursor:pointer;color:var(--mu);font-size:11px}
.th img{width:86px;height:110px;object-fit:cover;border-radius:12px;background:var(--card2);display:block;margin-bottom:4px}
.cmp{position:relative;margin-top:12px;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:3/4}
.cmp>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cmpBar{position:absolute;top:0;bottom:0;left:50%;width:3px;background:#fff;box-shadow:0 0 8px rgba(0,0,0,.6)}
.cmpL,.cmpR{position:absolute;bottom:10px;padding:4px 10px;border-radius:99px;background:rgba(0,0,0,.6);font-size:12px;font-weight:700}.cmpL{left:10px}.cmpR{right:10px}

/* planning */
.plancard{border-color:rgba(129,140,248,.45);background:linear-gradient(135deg,#1a1b3a,#111827)}
.dayrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--card2);border:1px solid var(--line);margin-top:8px}

/* ===== bannières manga ===== */
.manga{position:relative;overflow:hidden;height:150px;border-radius:18px;margin-bottom:14px;background:#fff;border:3px solid #0b0b0f;box-shadow:0 0 0 2px #fff,0 10px 30px rgba(0,0,0,.45),6px 6px 0 2px var(--mc);cursor:pointer;color:#0b0b0f;isolation:isolate;animation:mgIn .5s cubic-bezier(.2,1.4,.4,1) both;transform:rotate(-.6deg)}
.manga:active{transform:rotate(-.6deg) scale(.98)}
.mg-lines{position:absolute;inset:-60%;z-index:0;background:repeating-conic-gradient(from 0deg at 72% 50%,#0b0b0f 0 1.2deg,transparent 1.2deg 7deg);opacity:.16;animation:mgSpin 30s linear infinite}
.mg-lines:after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 72% 50%,#fff 0 18%,transparent 38%)}
.mg-dots{position:absolute;inset:0;z-index:0;background:radial-gradient(var(--mc) 1.6px,transparent 2px) 0 0/8px 8px;-webkit-mask:linear-gradient(105deg,#000 0 30%,transparent 62%);mask:linear-gradient(105deg,#000 0 30%,transparent 62%);opacity:.55}
.mg-sfx{position:absolute;z-index:3;left:47%;top:3px;font-size:28px;font-weight:900;letter-spacing:-.04em;color:var(--mc);-webkit-text-stroke:2.5px #0b0b0f;transform:rotate(9deg);text-shadow:3px 3px 0 #0b0b0f;font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;animation:mgSfx 1.6s ease-in-out infinite alternate}
.mg-fig{position:absolute;z-index:2;right:0;bottom:-12px;height:156px;width:156px;filter:drop-shadow(4px 4px 0 var(--mc));animation:mgFig 2.4s ease-in-out infinite alternate}
.mg-txt{position:absolute;z-index:4;left:14px;top:50%;transform:translateY(-50%);width:60%}
.mg-txt b{display:block;font-size:22px;line-height:1.02;font-weight:900;font-style:italic;letter-spacing:.01em;word-spacing:.18em;text-transform:uppercase;color:#fff;-webkit-text-stroke:1.2px #0b0b0f;paint-order:stroke fill;text-shadow:3px 3px 0 #0b0b0f,-1px -1px 0 #0b0b0f,1px -1px 0 #0b0b0f,-1px 1px 0 #0b0b0f}
.mg-txt small{display:inline-block;margin-top:8px;background:#fff;border:2px solid #0b0b0f;border-radius:14px 14px 14px 2px;padding:4px 9px;font-size:12px;font-weight:700;line-height:1.3;box-shadow:2px 2px 0 #0b0b0f}
.mg-tag{display:inline-block;background:var(--mc);color:#0b0b0f;font-weight:900;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border:2px solid #0b0b0f;transform:skew(-10deg);margin-bottom:6px}
.manga.slam{animation:mgSlam .55s cubic-bezier(.2,1.6,.4,1) both}
.manga.slam .mg-txt b{animation:mgShake .4s .2s}
@keyframes mgIn{from{opacity:0;transform:translateY(12px) rotate(-3deg) scale(.96)}}
@keyframes mgSlam{0%{transform:scale(1.5) rotate(4deg);opacity:0}60%{transform:scale(.96) rotate(-1.5deg);opacity:1}100%{transform:rotate(-.6deg)}}
@keyframes mgShake{20%{transform:translate(-3px,1px)}40%{transform:translate(3px,-1px)}60%{transform:translate(-2px,1px)}80%{transform:translate(1px,0)}}
@keyframes mgSpin{to{transform:rotate(360deg)}}
@keyframes mgSfx{from{transform:rotate(9deg) scale(1)}to{transform:rotate(5deg) scale(1.12)}}
@keyframes mgFig{from{transform:translateY(0)}to{transform:translateY(-5px)}}
.mg-splash{position:fixed;inset:0;z-index:300;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.72);backdrop-filter:blur(3px);animation:fade .2s}
.mg-splash.out{opacity:0;transition:opacity .3s}
.mg-splash:before{content:'';position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.12) 0 1.5deg,transparent 1.5deg 6deg);animation:mgSpin 8s linear infinite}
.manga.big{width:min(440px,100%);height:220px;margin:0}
.manga.big .mg-fig{height:220px;width:220px}.manga.big .mg-txt b{font-size:34px}.manga.big .mg-sfx{font-size:42px}
.sheet .manga{margin-top:4px}
@media(prefers-reduced-motion:reduce){.mg-lines,.mg-sfx,.mg-fig{animation:none}}

  const items = s.slots.map(sl => { const l = qLvl(sl.q, L); const it = JSON.parse(JSON.stringify(sl.v[l - 1])); if (l !== L) { it.adj = l > L ? 'up' : 'down'; adj.push({ q: sl.q, l, mv: it.mv }); } return it; });
  const wq = weakKey(k);
  if (wq) { const it = JSON.parse(JSON.stringify(QFIX[wq].v[Math.min(L, 2) - 1])); if (!items.some(x => x.mv === it.mv)) { it.fix = wq; items.push(it); } }
  return { nom: `${s.nom} · ${LV[L]}`, sport: s.sport, items, lvl: L, adj, fix: wq };
}
function specSeances(k) { const L = specLevel(k); return SPEC[k].seances.map((_, i) => specSession(k, i, L)); }
function setSpecLvl(k, l) { S.specLvl = S.specLvl || {}; if (l === recLevel()) delete S.specLvl[k]; else S.specLvl[k] = l; save(); haptic(8); openSpec(k, true); }

// adapte une séance aux résultats du test (répétitions, durées, allures)
function personalize(s) {
  const t = S.tests.at(-1); if (!t) return filterPain(applyPhase(s)); const R = t.res;
  if (s.items) s.items.forEach(it => {
    if (it.mv === 'pompe' && R.pompes) it.reps = clamp(Math.round(R.pompes * .6), 3, 40);
    if (it.mv === 'tractions' && R.tractions != null) it.reps = R.tractions >= 2 ? clamp(Math.round(R.tractions * .6), 1, 15) : 3;
    if (it.mv === 'gainage' && R.gainage && it.sec) it.sec = clamp(Math.round(R.gainage * .5 / 5) * 5, 15, 120);
    if (it.mv === 'gainlat' && R.gainage && it.sec) it.sec = clamp(Math.round(R.gainage * .35 / 5) * 5, 15, 60);
    if (it.mv === 'goblet' && R.squats && !S.profile.mat.some(m => m === 'halteres' || m === 'salle')) it.reps = clamp(Math.round(R.squats * .4), 8, 30);
  });
  const vma = t.info && t.info.vma;
  if (s.blocks && vma && s.sport === 'course') s.blocks = s.blocks.map(b => ({ ...b, d: b.d + (/endurance|footing|course lente|continue/i.test(b.d) ? ` (≈ ${pace(60 / (vma * .7))}/km)` : /VMA|30\/30/i.test(b.d) ? ` (≈ ${pace(60 / vma)}/km)` : /seuil|allure 10 km/i.test(b.d) ? ` (≈ ${pace(60 / (vma * .87))}/km)` : '') }));
  return filterPain(applyPhase(s));
}

  } catch (e) { toast('Photo illisible'); }
}
async function bodySave() {
  const b = { id: uid(), date: $('#bD').value || today() }; let any = false;

// photos : IndexedDB (trop lourdes pour le stockage simple)
function idb() { return new Promise((r, j) => { const q = indexedDB.open('apexfit', 1); q.onupgradeneeded = () => q.result.createObjectStore('ph'); q.onsuccess = () => r(q.result); q.onerror = () => j(q.error); }); }

async function compareForm(i0, i1) {
  const ph = [...S.body].filter(b => b.photo).sort((a, b) => a.date.localeCompare(b.date)); const A = ph[i0 ?? 0], B = ph[i1 ?? ph.length - 1];

    <div class="cmp" id="cmp"><img src="${await photoURL(B.photo)}"><img id="cmpA" src="${await photoURL(A.photo)}" style="clip-path:inset(0 50% 0 0)"><div class="cmpBar" id="cmpBar"></div>
    <span class="cmpL">Avant</span><span class="cmpR">Après</span></div><input type="range" min="0" max="100" value="50" oninput="$('#cmpA').style.clipPath='inset(0 '+(100-this.value)+'% 0 0)';$('#cmpBar').style.left=this.value+'%'">
    ${dw != null ? `<p class="small" style="text-align:center">Poids : <b>${String(A.poids).replace('.', ',')} → ${String(B.poids).replace('.', ',')} kg</b> (${dw > 0 ? '+' : ''}${dw.toFixed(1).replace('.', ',')} kg) en ${Math.round((parseD(B.date) - parseD(A.date)) / 864e5)} jours</p>` : ''}`);

function spark(c, v) {
  if (!c || v.length < 2) return; const x = c.getContext('2d'), W = c.width, H = c.height, mn = Math.min(...v), mx = Math.max(...v), r = mx - mn || 1;

// ===================== RAPPELS =====================
const JOURS = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'], ICSD = ['MO', 'TU', 'WE', 'TH', 'FR', 'SA', 'SU'];

    <label class="f">Jours d’entraînement</label><div class="chips" style="flex-wrap:wrap" id="rD">${JOURS.map((j, i) => `<button class="chip ${R0.days.includes(i) ? 'on' : ''}" data-d="${i}" onclick="this.classList.toggle('on')">${j}</button>`).join('')}</div>

    ${S.remind ? `<button class="btn dan w" style="margin-top:8px" onclick="S.remind=null;save();closeSheet();render();toast('Rappels désactivés dans l’appli (supprimez aussi l’événement du calendrier)')">Désactiver les rappels</button>` : ''}
    <p class="mu tiny" style="margin-top:10px">Sur iPhone : touchez le fichier téléchargé puis « Ajouter tout ». Pour changer d’horaire, supprimez l’ancien événement « ApexFit » de votre calendrier.</p>`);

function remindSave() {

    `RRULE:FREQ=WEEKLY;BYDAY=${days.map(i => ICSD[i]).join(',')}`, `SUMMARY:💪 Séance ApexFit${p ? ' — ' + p.nom : ''}`, `DESCRIPTION:Ouvrez ApexFit pour démarrer votre séance : ${location.href.split('#')[0]}`,

// ===================== INTERACTIONS DYNAMIQUES =====================
const haptic = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
const reduced = () => !!S.calm || matchMedia('(prefers-reduced-motion: reduce)').matches;
let lastKey = '';
function enhance() {
  const key = route.v + (route.sp || '') + (route.v === 'sport' ? spTab : '') + (route.v === 'programmes' ? progF : '');
  const fresh = key !== lastKey; lastKey = key;
  if (fresh && !reduced()) {
    [...$('#view').children].forEach((el, i) => { el.style.setProperty('--i', Math.min(i, 12)); el.classList.add('rise'); });
    countUp(); fillBars(); ringFill();
    if ($('#weekChart')) { const t0 = performance.now(); const st = t => { const k = Math.min(1, (t - t0) / 700); weekChart(1 - Math.pow(1 - k, 3)); if (k < 1) requestAnimationFrame(st); }; requestAnimationFrame(st); }
  }
  const cal = $('#view .cal'); if (cal) swipeCal(cal.parentElement);
  $$('#view .li[onclick^="openSession"]').forEach(swipeDelete);
}
// chiffres qui défilent jusqu'à leur valeur
function countUp() {
  $$('#view .kpi .v, #view .ring b, #view .hero [data-count]').forEach(el => {
    const tn = [...el.childNodes].find(n => n.nodeType === 3 && /\d/.test(n.textContent)); if (!tn) return;
    const m = tn.textContent.match(/(\d+(?:[.,]\d+)?)/); if (!m) return;
    const target = parseFloat(m[1].replace(',', '.')), dec = (m[1].split(/[.,]/)[1] || '').length, pre = tn.textContent.slice(0, m.index), post = tn.textContent.slice(m.index + m[1].length);
    if (!target) return; const t0 = performance.now(), D = 800;
    const st = t => { const k = Math.min(1, (t - t0) / D), v = target * (1 - Math.pow(1 - k, 3)); tn.textContent = pre + v.toFixed(dec) + post; if (k < 1) requestAnimationFrame(st); };
    requestAnimationFrame(st);
  });
}
function fillBars() { $$('#view .pbar i').forEach(i => { const w = i.style.width; i.style.width = '0'; requestAnimationFrame(() => requestAnimationFrame(() => { i.style.width = w; })); }); }
function ringFill() { const r = $('#view .ring'); if (!r) return; const p = +getComputedStyle(r).getPropertyValue('--p') || 0, t0 = performance.now(); const st = t => { const k = Math.min(1, (t - t0) / 900); r.style.setProperty('--p', (p * (1 - Math.pow(1 - k, 3))).toFixed(1)); if (k < 1) requestAnimationFrame(st); }; requestAnimationFrame(st); }
// calendrier : balayer pour changer de mois
function swipeCal(box) {

  box.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  box.addEventListener('touchend', e => { if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + (dx < 0 ? 1 : -1), 1); haptic(8); render(); const c = $('#view .cal'); if (c) c.classList.add(dx < 0 ? 'slideL' : 'slideR'); } });
}
// séance : balayer vers la gauche pour supprimer (avec annulation)
function swipeDelete(el) {
  if (el.dataset.sw) return; el.dataset.sw = 1; let x0 = null, y0 = 0, dx = 0, moved = false;
  const id = (el.getAttribute('onclick').match(/openSession\('([^']+)'\)/) || [])[1]; if (!id) return;
  el.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = 0; moved = false; el.style.transition = 'none'; }, { passive: true });
  el.addEventListener('touchmove', e => { if (x0 == null) return; dx = Math.min(0, e.touches[0].clientX - x0); if (Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(e.touches[0].clientY - y0)) { moved = true; el.style.transform = `translateX(${dx}px)`; el.style.boxShadow = `inset ${-dx}px 0 0 rgba(244,63,94,${Math.min(.5, -dx / 300)})`; } }, { passive: true });
  el.addEventListener('touchend', () => { if (x0 == null) return; x0 = null; el.style.transition = 'transform .25s, box-shadow .25s';
    if (dx < -110) { el.style.transform = 'translateX(-110%)'; haptic(20); setTimeout(() => deleteWithUndo(id), 220); } else { el.style.transform = ''; el.style.boxShadow = ''; } });

}

// confettis
function confetti(n = 100) {

  const P = Array.from({ length: n }, () => ({ x: W / 2 + (Math.random() - .5) * W * .3, y: H * .55, vx: (Math.random() - .5) * 34, vy: -Math.random() * 46 - 18, r: Math.random() * 10 + 6, a: Math.random() * 6, va: (Math.random() - .5) * .4, c: col[Math.random() * col.length | 0] }));

}
